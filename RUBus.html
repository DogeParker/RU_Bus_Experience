<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The RU Bus Experience Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(204, 0, 51, 0.5);
            border: 4px solid #cc0033;
        }
        canvas {
            background-color: #222;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        #controls-hint {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="route-info">Route: CA ➔ Busch</div>
            <div id="bus-capacity">Bus Capacity: 0/15</div>
            <div id="timer">Time Left: 60s</div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="controls-hint">
        <strong>Controls:</strong> Stage 1: [WASD] Move | [Q] Punch/Push | Stage 2: [A/D] Balance Against Brakes
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game States
const STATES = { ROUTE_SELECT: 0, STAGE1_STOP: 1, STAGE2_BUS: 2, WIN: 3, GAME_OVER: 4 };
let currentState = STATES.ROUTE_SELECT;

// Route Configurations
const ROUTES = [
    { name: "CA ➔ Busch (Route B)", time: 45, maxBusCapacity: 12, busSpeed: 1.2 },
    { name: "Busch ➔ CD (Route REXB)", time: 60, maxBusCapacity: 15, busSpeed: 1.5 },
    { name: "CD ➔ CA (Route EE)", time: 50, maxBusCapacity: 14, busSpeed: 1.3 },
    { name: "CD ➔ Livi (Route REXL)", time: 55, maxBusCapacity: 15, busSpeed: 1.4 },
    { name: "Busch ➔ Livi (Route C)", time: 40, maxBusCapacity: 10, busSpeed: 1.1 },
    { name: "CA ➔ Livi (Route LX)", time: 45, maxBusCapacity: 16, busSpeed: 1.6 }
];
let currentRouteIdx = 0;

// Timer Variables
let timeLeft = 0;
let lastTime = 0;

// Sprite Loader Placeholder (Replace 'student_sprite.png' with your file)
const studentSprite = new Image();
studentSprite.src = 'student_sprite.png'; 
let spriteLoaded = false;
studentSprite.onload = () => { spriteLoaded = true; };

// Inputs
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Mouse Input for Route Selection
canvas.addEventListener('click', (e) => {
    if (currentState === STATES.ROUTE_SELECT) {
        const rect = canvas.getBoundingClientRect();
        const clickY = e.clientY - rect.top;
        const startY = 150;
        for (let i = 0; i < ROUTES.length; i++) {
            if (clickY >= startY + i * 45 && clickY <= startY + i * 45 + 35) {
                startRoute(i);
                break;
            }
        }
    } else if (currentState === STATES.WIN || currentState === STATES.GAME_OVER) {
        currentState = STATES.ROUTE_SELECT;
    }
});

// Game Entities
let player = { x: 100, y: 350, vx: 0, vy: 0, speed: 3.5, size: 24, isPunching: false, punchTimer: 0 };
let bus = { x: 450, y: 150, w: 120, h: 240, passengers: 0, maxPassengers: 15, doorX: 510, doorY: 320 };
let npcs = [];
let busBalance = 0; // -100 to 100 (Stage 2)
let busForce = 0;
let stage2Progress = 0;

function startRoute(routeIdx) {
    currentRouteIdx = routeIdx;
    const route = ROUTES[routeIdx];
    timeLeft = route.time;
    currentState = STATES.STAGE1_STOP;
    
    // Player reset closer to the bus on the sidewalk
    player.x = 400;
    player.y = 330;
    
    // Bus setup
    bus.passengers = Math.floor(route.maxBusCapacity * 0.4); 
    bus.maxPassengers = route.maxBusCapacity;
    bus.x = 450;
    bus.y = 150;
    bus.w = 120;
    bus.h = 240;
    bus.doorX = 510;
    bus.doorY = 320;
    
    // Spawn Crowd NPCs in the same sidewalk area for equal starting chance
    npcs = [];
    for (let i = 0; i < 22; i++) {
        npcs.push({
            x: 370 + Math.random() * 120,
            y: 280 + Math.random() * 100,
            vx: (Math.random() - 0.5) * 1,
            vy: (Math.random() - 0.5) * 1,
            size: 22,
            stunned: 0
        });
    }
    
    // Stage 2 reset
    busBalance = 0;
    busForce = 0;
    stage2Progress = 0;
    lastTime = performance.now();
}

function update(dt) {
    if (currentState !== STATES.STAGE1_STOP && currentState !== STATES.STAGE2_BUS) return;

    // Timer Update
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        currentState = STATES.GAME_OVER;
        return;
    }

    if (currentState === STATES.STAGE1_STOP) {
        updateStage1(dt);
    } else if (currentState === STATES.STAGE2_BUS) {
        updateStage2(dt);
    }
}

function updateStage1(dt) {
    // Player Movement (WASD)
    player.vx = 0;
    player.vy = 0;
    if (keys['w'] || keys['W']) player.vy = -player.speed;
    if (keys['s'] || keys['S']) player.vy = player.speed;
    if (keys['a'] || keys['A']) player.vx = -player.speed;
    if (keys['d'] || keys['D']) player.vx = player.speed;

    player.x += player.vx;
    player.y += player.vy;

    // Keep player in bounds
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
    player.y = Math.max(150, Math.min(canvas.height - 20, player.y));

    // Punching / Pushing Mechanic (Q)
    if ((keys['q'] || keys['Q']) && player.punchTimer <= 0) {
        player.isPunching = true;
        player.punchTimer = 15; // Cooldown frames
    }
    if (player.punchTimer > 0) {
        player.punchTimer--;
        if (player.punchTimer < 10) player.isPunching = false;
    }

    // NPC Logic
    npcs.forEach(npc => {
        if (npc.stunned > 0) {
            npc.stunned--;
            return;
        }

        let dx = bus.doorX - npc.x;
        let dy = bus.doorY - npc.y;
        let dist = Math.hypot(dx, dy);

        if (dist > 10) {
            npc.x += (dx / dist) * 0.8;
            npc.y += (dy / dist) * 0.8;
        } else {
            if (bus.passengers < bus.maxPassengers) {
                bus.passengers++;
                npc.x = -1000; 
            }
        }

        // Punch collision check
        if (player.isPunching) {
            let pdx = npc.x - player.x;
            let pdy = npc.y - player.y;
            let pdist = Math.hypot(pdx, pdy);
            if (pdist < 50) {
                npc.x += (pdx / pdist) * 40;
                npc.y += (pdy / pdist) * 40;
                npc.stunned = 30;
            }
        }
    });

    if (bus.passengers >= bus.maxPassengers) {
        currentState = STATES.GAME_OVER;
    }

    // Player Boarding Check
    let doorDist = Math.hypot(bus.doorX - player.x, bus.doorY - player.y);
    if (doorDist < 30) {
        currentState = STATES.STAGE2_BUS; 
    }
}

function updateStage2(dt) {
    stage2Progress += dt * 10;

    if (Math.random() < 0.03) {
        busForce += (Math.random() - 0.5) * 8; 
    }
    
    busForce *= 0.95;
    busBalance += busForce;

    if (keys['a'] || keys['ArrowLeft']) busBalance -= 1.5;
    if (keys['d'] || keys['ArrowRight']) busBalance += 1.5;

    if (Math.abs(busBalance) > 100) {
        currentState = STATES.GAME_OVER;
    }

    if (stage2Progress >= 100) {
        currentState = STATES.WIN;
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById('timer').innerText = `Time Left: ${Math.ceil(timeLeft)}s`;
    document.getElementById('route-info').innerText = `Route: ${ROUTES[currentRouteIdx].name}`;
    document.getElementById('bus-capacity').innerText = `Bus Capacity: ${bus.passengers}/${bus.maxPassengers}`;

    if (currentState === STATES.ROUTE_SELECT) {
        renderRouteSelect();
    } else if (currentState === STATES.STAGE1_STOP) {
        renderStage1();
    } else if (currentState === STATES.STAGE2_BUS) {
        renderStage2();
    } else if (currentState === STATES.WIN) {
        renderEndScreen(true);
    } else if (currentState === STATES.GAME_OVER) {
        renderEndScreen(false);
    }
}

function renderRouteSelect() {
    ctx.fillStyle = "#cc0033";
    ctx.font = "28px Courier New";
    ctx.fillText("THE RU BUS EXPERIENCE GAME", 180, 70);
    
    ctx.fillStyle = "#fff";
    ctx.font = "18px Courier New";
    ctx.fillText("Select a Route to Get to Class On Time:", 200, 110);

    const startY = 150;
    ROUTES.forEach((route, i) => {
        ctx.fillStyle = "#333";
        ctx.fillRect(200, startY + i * 45, 400, 35);
        ctx.strokeStyle = "#cc0033";
        ctx.strokeRect(200, startY + i * 45, 400, 35);

        ctx.fillStyle = "#fff";
        ctx.font = "16px Courier New";
        ctx.fillText(route.name, 220, startY + i * 45 + 23);
    });
}

function renderStage1() {
    // Street Background
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(0, 120, canvas.width, canvas.height - 120);

    // Sidewalk
    ctx.fillStyle = "#777";
    ctx.fillRect(250, 250, 350, 200);
    ctx.fillStyle = "#666";
    ctx.fillRect(250, 250, 350, 15);

    // Bus Drawing
    ctx.fillStyle = "#cc0033"; 
    ctx.fillRect(bus.x, bus.y, bus.w, bus.h);
    
    // Rutgers Gold Stripe
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(bus.x, bus.y + 80, bus.w, 15);

    // Bus Windows
    ctx.fillStyle = "#111";
    ctx.fillRect(bus.x + 15, bus.y + 20, 35, 45);
    ctx.fillRect(bus.x + 70, bus.y + 20, 35, 45);
    ctx.fillRect(bus.x + 15, bus.y + 110, 35, 45);
    ctx.fillRect(bus.x + 70, bus.y + 110, 35, 45);

    // Bus Door
    ctx.fillStyle = "#ddd";
    ctx.fillRect(bus.doorX - 15, bus.doorY - 15, 30, 30);
    ctx.fillStyle = "#111";
    ctx.font = "10px Courier New";
    ctx.fillText("DOOR", bus.doorX - 12, bus.doorY + 3);

    // Draw Crowd NPCs
    npcs.forEach(npc => {
        if (npc.x < 0) return;
        if (spriteLoaded) {
            ctx.drawImage(studentSprite, npc.x - 12, npc.y - 12, 24, 24);
        } else {
            ctx.fillStyle = npc.stunned > 0 ? "#ff8800" : "#5577ff";
            ctx.beginPath();
            ctx.arc(npc.x, npc.y, npc.size / 2, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Draw Player
    if (spriteLoaded) {
        ctx.drawImage(studentSprite, player.x - 16, player.y - 16, 32, 32);
    } else {
        ctx.fillStyle = "#00ffcc";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Punch Effect Visual
    if (player.isPunching) {
        ctx.strokeStyle = "#ffff00";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 35, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function renderStage2() {
    // Bus Interior Background
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Side Windows
    ctx.fillStyle = "#223344";
    ctx.fillRect(50, 40, 90, 370);
    ctx.fillRect(660, 40, 90, 370);
    
    ctx.strokeStyle = "#444";
    ctx.lineWidth = 4;
    ctx.strokeRect(50, 40, 90, 370);
    ctx.strokeRect(660, 40, 90, 370);

    // Bus Center Aisle Floor
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(140, 0, 520, canvas.height);

    // Side Seats (Rutgers Blue paired seats)
    ctx.fillStyle = "#1e3a8a"; 
    for (let i = 0; i < 5; i++) {
        ctx.fillRect(55, 60 + i * 72, 75, 48);
        ctx.strokeStyle = "#ffcc00";
        ctx.strokeRect(55, 60 + i * 72, 75, 48);
        
        ctx.fillRect(670, 60 + i * 72, 75, 48);
        ctx.strokeRect(670, 60 + i * 72, 75, 48);
    }

    // Yellow Grab Poles along the aisle
    ctx.strokeStyle = "#ffcc00";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(200, 0); ctx.lineTo(200, 420);
    ctx.moveTo(600, 0); ctx.lineTo(600, 420);
    ctx.stroke();

    // Driver Seat & Dashboard Area
    ctx.fillStyle = "#222";
    ctx.fillRect(300, 0, 200, 75);
    ctx.strokeStyle = "#cc0033";
    ctx.lineWidth = 2;
    ctx.strokeRect(300, 0, 200, 75);
    
    // Driver NPC
    ctx.fillStyle = "#ffaa00";
    ctx.beginPath();
    ctx.arc(400, 30, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "10px Courier New";
    ctx.fillText("DRIVER", 380, 62);

    // Packed NPC Passengers Inside
    ctx.fillStyle = "#555";
    for (let i = 0; i < 10; i++) {
        let px = 240 + (i % 2) * 320 + Math.sin(stage2Progress * 0.1 + i) * 4;
        let py = 100 + Math.floor(i / 2) * 60;
        ctx.beginPath();
        ctx.arc(px, py, 16, 0, Math.PI * 2);
        ctx.fill();
    }

    // Player Standing & Balance Indicator in Aisle
    let playerX = 400 + busBalance * 2;
    ctx.fillStyle = "#00ffcc";
    ctx.beginPath();
    ctx.arc(playerX, 350, 22, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = "#fff";
    ctx.font = "10px Courier New";
    ctx.fillText("YOU", playerX - 10, 380);

    // Balance Bar UI at Bottom
    ctx.fillStyle = "#222";
    ctx.fillRect(200, 440, 400, 25);
    ctx.fillStyle = Math.abs(busBalance) > 70 ? "#ff3333" : "#00ffcc";
    ctx.fillRect(400, 440, busBalance * 2, 25);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(200, 440, 400, 25);

    // Trip Progress and Instructions
    ctx.fillStyle = "#fff";
    ctx.font = "14px Courier New";
    ctx.fillText(`Trip Progress: ${Math.floor(stage2Progress)}%`, 310, 22);
    ctx.fillText("HOLD ON FOR DEAR LIFE! (Use A/D to Balance)", 185, 425);
}

function renderEndScreen(isWin) {
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "32px Courier New";
    if (isWin) {
        ctx.fillStyle = "#00ffcc";
        ctx.fillText("YOU MADE IT TO CLASS!", 220, 220);
        ctx.font = "18px Courier New";
        ctx.fillStyle = "#fff";
        ctx.fillText("You survived the RU Bus system peak hours.", 190, 270);
    } else {
        ctx.fillStyle = "#ff3333";
        ctx.fillText("YOU LOST!", 330, 200);
        ctx.font = "18px Courier New";
        ctx.fillStyle = "#fff";
        ctx.fillText("You missed the bus or went flying during a break!", 140, 250);
        ctx.fillText("You are late to class and failed the semester.", 160, 280);
    }

    ctx.fillStyle = "#aaa";
    ctx.fillText("Click anywhere to return to Route Selection", 180, 350);
}

function gameLoop(time) {
    let dt = (time - lastTime) / 1000;
    if (isNaN(dt)) dt = 0;
    lastTime = time;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
