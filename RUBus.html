<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The RU Bus Experience Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(204, 0, 51, 0.5);
            border: 4px solid #cc0033;
        }
        canvas {
            background-color: #222;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        .capacity-bar-container {
            width: 130px;
            height: 14px;
            background: #333;
            border: 2px solid #fff;
            display: inline-block;
            position: relative;
            vertical-align: middle;
            margin-left: 5px;
        }
        .capacity-fill {
            height: 100%;
            background: #cc0033;
            width: 0%;
            transition: width 0.1s;
        }
        #controls-hint {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="route-info">Route: CA ➔ Busch</div>
            <div>
                <span id="bus-capacity-text">Bus: 0/15</span>
                <div class="capacity-bar-container"><div id="capacity-fill" class="capacity-fill"></div></div>
            </div>
            <div id="timer" style="color: #ffcc00;">Time Left: 90s</div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="controls-hint">
        <strong>Controls:</strong> Stage 1: [WASD] Move | [Q] Punch/Push Students | Stage 2: [A/D] Balance Against Bus Brakes
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game States
const STATES = { ROUTE_SELECT: 0, STAGE1_STOP: 1, STAGE2_BUS: 2, WIN: 3, GAME_OVER: 4 };
let currentState = STATES.ROUTE_SELECT;

// Route Configurations
const ROUTES = [
    { id: "CA", dest: "Busch", name: "CA ➔ Busch (Route B)", time: 85, maxBusCapacity: 14, campus: "College Ave" },
    { id: "Busch", dest: "CD", name: "Busch ➔ CD (Route REXB)", time: 95, maxBusCapacity: 16, campus: "Busch" },
    { id: "CD", dest: "CA", name: "CD ➔ CA (Route EE)", time: 90, maxBusCapacity: 15, campus: "CD" },
    { id: "CD", dest: "Livi", name: "CD ➔ Livi (Route REXL)", time: 95, maxBusCapacity: 16, campus: "CD" },
    { id: "Busch", dest: "Livi", name: "Busch ➔ Livi (Route C)", time: 80, maxBusCapacity: 12, campus: "Busch" },
    { id: "CA", dest: "Livi", name: "CA ➔ Livi (Route LX)", time: 85, maxBusCapacity: 18, campus: "College Ave" }
];
let currentRouteIdx = 0;

// Color Palette Pools for Random Student NPCs
const HAIR_COLORS = ["#1a365d", "#4a2c11", "#171717", "#d97706", "#9a3412", "#2563eb"];
const SHIRT_COLORS = ["#dc2626", "#059669", "#7c3aed", "#ea580c", "#2563eb", "#0284c7", "#4b5563", "#e11d48"];
const BAG_COLORS = ["#facc15", "#06b6d4", "#84cc16", "#d946ef", "#f97316"];
const PANTS_COLORS = ["#1e3a8a", "#1e293b", "#334155", "#78350f"];

// Timer & Game UI Variables
let timeLeft = 0;
let lastTime = 0;

// Inputs tracking
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Mouse Input for Route Selection and Game Resets
canvas.addEventListener('click', (e) => {
    if (currentState === STATES.ROUTE_SELECT) {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        const startY = 135;
        for (let i = 0; i < ROUTES.length; i++) {
            if (clickX >= 180 && clickX <= 620 && clickY >= startY + i * 50 && clickY <= startY + i * 50 + 40) {
                startRoute(i);
                break;
            }
        }
    } else if (currentState === STATES.WIN || currentState === STATES.GAME_OVER) {
        resetToMenu();
    }
});

// Helper Function: Generates random style properties for NPCs
function getRandomStudentStyle() {
    return {
        hair: HAIR_COLORS[Math.floor(Math.random() * HAIR_COLORS.length)],
        shirt: SHIRT_COLORS[Math.floor(Math.random() * SHIRT_COLORS.length)],
        bag: BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)],
        pants: PANTS_COLORS[Math.floor(Math.random() * PANTS_COLORS.length)],
        skin: "#f59e0b"
    };
}

// Custom Player Character Style
const playerStyle = {
    hair: "#0284c7",
    shirt: "#dc2626",
    bag: "#facc15",
    pants: "#1e3a8a",
    skin: "#fbbf24"
};

// Game Entities
let player = { x: 380, y: 330, vx: 0, vy: 0, speed: 2.8, isPunching: false, punchTimer: 0, style: playerStyle };
let bus = { x: 460, y: 150, w: 120, h: 240, passengers: 0, maxPassengers: 15, doorX: 520, doorY: 320 };
let npcs = [];
let busBalance = 0;
let busForce = 0;
let stage2Progress = 0;

// --- PIXEL ART RENDERING FOR STUDENT MODELS ---
function drawPixelStudent(x, y, style, scale = 1, isStunned = false) {
    ctx.save();
    ctx.translate(x, y);

    // Stun Flash effect
    if (isStunned) {
        ctx.shadowColor = "#ff3300";
        ctx.shadowBlur = 10;
    }

    const p = scale * 1.5; // Pixel size scalar (creates nice small pixel art model)

    // Hair
    ctx.fillStyle = style.hair;
    ctx.fillRect(-4 * p, -14 * p, 8 * p, 4 * p);
    ctx.fillRect(-5 * p, -12 * p, 3 * p, 4 * p);

    // Face / Skin
    ctx.fillStyle = style.skin;
    ctx.fillRect(-3 * p, -10 * p, 6 * p, 4 * p);

    // Backpack (Back view)
    ctx.fillStyle = style.bag;
    ctx.fillRect(-5 * p, -5 * p, 3 * p, 7 * p);

    // Shirt / Hoodie Body
    ctx.fillStyle = style.shirt;
    ctx.fillRect(-3 * p, -6 * p, 6 * p, 6 * p);
    
    // Backpack Straps
    ctx.fillStyle = style.bag;
    ctx.fillRect(-2 * p, -6 * p, 1 * p, 6 * p);
    ctx.fillRect(1 * p, -6 * p, 1 * p, 6 * p);

    // Pants
    ctx.fillStyle = style.pants;
    ctx.fillRect(-3 * p, 0, 2.5 * p, 7 * p);
    ctx.fillRect(0.5 * p, 0, 2.5 * p, 7 * p);

    // Shoes
    ctx.fillStyle = "#701a75";
    ctx.fillRect(-4 * p, 7 * p, 3 * p, 2 * p);
    ctx.fillRect(1 * p, 7 * p, 3 * p, 2 * p);

    ctx.restore();
}

function resetToMenu() {
    currentState = STATES.ROUTE_SELECT;
    timeLeft = 0;
    bus.passengers = 0;
    stage2Progress = 0;
    busBalance = 0;
    npcs = [];
    document.getElementById('timer').innerText = `Time Left: --`;
    document.getElementById('bus-capacity-text').innerText = `Bus: 0/15`;
    document.getElementById('capacity-fill').style.width = '0%';
}

function startRoute(routeIdx) {
    currentRouteIdx = routeIdx;
    const route = ROUTES[routeIdx];
    timeLeft = route.time;
    currentState = STATES.STAGE1_STOP;
    
    player.x = 380;
    player.y = 330;
    player.vx = 0;
    player.vy = 0;
    
    bus.passengers = Math.floor(route.maxBusCapacity * 0.3);
    bus.maxPassengers = route.maxBusCapacity;
    bus.x = 460;
    bus.y = 150;
    bus.w = 120;
    bus.h = 240;
    bus.doorX = 520;
    bus.doorY = 320;
    
    // Spawn Crowd NPCs with random color palettes
    npcs = [];
    for (let i = 0; i < 20; i++) {
        npcs.push({
            x: 320 + Math.random() * 160,
            y: 260 + Math.random() * 130,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            stunned: 0,
            style: getRandomStudentStyle()
        });
    }
    
    busBalance = 0;
    busForce = 0;
    stage2Progress = 0;
    lastTime = performance.now();
}

function update(dt) {
    if (currentState !== STATES.STAGE1_STOP && currentState !== STATES.STAGE2_BUS) return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        currentState = STATES.GAME_OVER;
        return;
    }

    if (currentState === STATES.STAGE1_STOP) {
        updateStage1(dt);
    } else if (currentState === STATES.STAGE2_BUS) {
        updateStage2(dt);
    }
}

function updateStage1(dt) {
    player.vx = 0;
    player.vy = 0;
    if (keys['w'] || keys['W']) player.vy = -player.speed;
    if (keys['s'] || keys['S']) player.vy = player.speed;
    if (keys['a'] || keys['A']) player.vx = -player.speed;
    if (keys['d'] || keys['D']) player.vx = player.speed;

    player.x += player.vx;
    player.y += player.vy;

    player.x = Math.max(220, Math.min(canvas.width - 120, player.x));
    player.y = Math.max(180, Math.min(canvas.height - 50, player.y));

    // Punch / Push Mechanic
    if ((keys['q'] || keys['Q']) && player.punchTimer <= 0) {
        player.isPunching = true;
        player.punchTimer = 30;
        
        npcs.forEach(npc => {
            let pdx = npc.x - player.x;
            let pdy = npc.y - player.y;
            let pdist = Math.hypot(pdx, pdy);
            if (pdist < 50) {
                let pushAngle = Math.atan2(pdy, pdx);
                npc.vx = Math.cos(pushAngle) * 2.2;
                npc.vy = Math.sin(pushAngle) * 2.2;
                npc.stunned = 18;
            }
        });
    }
    if (player.punchTimer > 0) {
        player.punchTimer--;
        if (player.punchTimer < 22) player.isPunching = false;
    }

    npcs.forEach(npc => {
        if (npc.stunned > 0) {
            npc.stunned--;
            npc.x += npc.vx;
            npc.y += npc.vy;
            npc.vx *= 0.75;
            npc.vy *= 0.75;
            return;
        }

        let dx = bus.doorX - npc.x;
        let dy = bus.doorY - npc.y;
        let dist = Math.hypot(dx, dy);

        if (dist > 14) {
            npc.x += (dx / dist) * 0.65;
            npc.y += (dy / dist) * 0.65;
        } else {
            if (bus.passengers < bus.maxPassengers) {
                bus.passengers++;
                npc.x = -9999; 
            }
        }

        let pdist = Math.hypot(npc.x - player.x, npc.y - player.y);
        if (pdist < 26) {
            let angle = Math.atan2(npc.y - player.y, npc.x - player.x);
            npc.x += Math.cos(angle) * 1.2;
            npc.y += Math.sin(angle) * 1.2;
        }
    });

    if (bus.passengers >= bus.maxPassengers) {
        currentState = STATES.GAME_OVER;
    }

    let doorDist = Math.hypot(bus.doorX - player.x, bus.doorY - player.y);
    if (doorDist < 28 && bus.passengers < bus.maxPassengers) {
        currentState = STATES.STAGE2_BUS; 
    }
}

function updateStage2(dt) {
    stage2Progress += dt * 6.5; 

    if (Math.random() < 0.025) {
        busForce += (Math.random() - 0.5) * 6.5; 
    }
    
    busForce *= 0.94; 
    busBalance += busForce;

    if (keys['a'] || keys['arrowleft']) busBalance -= 1.4;
    if (keys['d'] || keys['arrowright']) busBalance += 1.4;

    if (Math.abs(busBalance) > 100) {
        currentState = STATES.GAME_OVER;
    }

    if (stage2Progress >= 100) {
        currentState = STATES.WIN;
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (currentState !== STATES.ROUTE_SELECT && currentState !== STATES.WIN && currentState !== STATES.GAME_OVER) {
        const route = ROUTES[currentRouteIdx];
        document.getElementById('timer').innerText = `Time Left: ${Math.ceil(timeLeft)}s`;
        document.getElementById('route-info').innerText = `Route: ${route.name}`;
        document.getElementById('bus-capacity-text').innerText = `Bus: ${bus.passengers}/${bus.maxPassengers}`;
        const fillPercent = (bus.passengers / bus.maxPassengers) * 100;
        document.getElementById('capacity-fill').style.width = fillPercent + '%';
        document.getElementById('capacity-fill').style.background = fillPercent >= 100 ? '#ff3333' : '#cc0033';
    }

    if (currentState === STATES.ROUTE_SELECT) {
        renderRouteSelect();
    } else if (currentState === STATES.STAGE1_STOP) {
        renderStage1();
    } else if (currentState === STATES.STAGE2_BUS) {
        renderStage2();
    } else if (currentState === STATES.WIN) {
        renderEndScreen(true);
    } else if (currentState === STATES.GAME_OVER) {
        renderEndScreen(false);
    }
}

function renderRouteSelect() {
    ctx.fillStyle = "#161616";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#cc0033";
    ctx.font = "bold 26px Courier New";
    ctx.fillText("THE RU BUS EXPERIENCE GAME", 170, 55);
    
    ctx.fillStyle = "#fff";
    ctx.font = "16px Courier New";
    ctx.fillText("Select your campus route to get to class on time:", 170, 95);

    const startY = 135;
    ROUTES.forEach((route, i) => {
        ctx.fillStyle = "#262626";
        ctx.fillRect(180, startY + i * 50, 440, 40);
        ctx.strokeStyle = "#cc0033";
        ctx.lineWidth = 2;
        ctx.strokeRect(180, startY + i * 50, 440, 40);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 15px Courier New";
        ctx.fillText(route.name, 200, startY + i * 50 + 25);
        
        ctx.fillStyle = "#ffcc00";
        ctx.font = "12px Courier New";
        ctx.fillText(`Campus: ${route.campus}`, 480, startY + i * 50 + 25);
    });
}

function renderStage1() {
    const campus = ROUTES[currentRouteIdx].campus;

    // Background Rendering
    if (campus === "College Ave") {
        ctx.fillStyle = "#2b1810"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8b3a2b"; ctx.fillRect(50, 40, 700, 120); 
        ctx.fillStyle = "#112233"; ctx.fillRect(150, 70, 180, 90);  
        ctx.fillRect(450, 70, 180, 90);
        ctx.fillStyle = "#ffcc00"; ctx.font = "12px Courier New";
        ctx.fillText("COLLEGE AVE STUDENT CENTER BUS STOP", 230, 30);
    } else if (campus === "Busch") {
        ctx.fillStyle = "#182026"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#3a4a5a"; ctx.fillRect(60, 40, 680, 110); 
        ctx.fillStyle = "#222"; ctx.fillRect(120, 60, 140, 70);
        ctx.fillRect(540, 60, 140, 70);
        ctx.fillStyle = "#00ffcc"; ctx.font = "12px Courier New";
        ctx.fillText("BUSCH STUDENT CENTER PLAZA STOP", 260, 30);
    } else if (campus === "CD") {
        ctx.fillStyle = "#142214"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#703020"; ctx.fillRect(60, 40, 680, 100); 
        ctx.fillStyle = "#1e3a1e"; 
        for(let t=0; t<8; t++) {
            ctx.beginPath(); ctx.arc(80 + t * 90, 110, 25, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = "#aaffaa"; ctx.font = "12px Courier New";
        ctx.fillText("BIEL ROAD BUS STOP (COOK / DOUGLASS)", 230, 30);
    } else {
        ctx.fillStyle = "#101826"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#2a3b52"; ctx.fillRect(60, 35, 680, 115);
        ctx.fillStyle = "#4af"; ctx.fillRect(100, 60, 120, 80); 
        ctx.fillRect(340, 60, 120, 80);
        ctx.fillRect(580, 60, 120, 80);
        ctx.fillStyle = "#00ffff"; ctx.font = "12px Courier New";
        ctx.fillText("LIVINGSTON STUDENT CENTER PLAZA", 260, 30);
    }

    // Street Road & Sidewalk
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 200, canvas.width, 300);
    ctx.fillStyle = "#777"; 
    ctx.fillRect(200, 230, 420, 240);
    ctx.fillStyle = "#555"; 
    ctx.fillRect(200, 230, 420, 16);

    // Bus Drawing
    ctx.fillStyle = "#cc0033"; 
    ctx.fillRect(bus.x, bus.y, bus.w, bus.h);
    
    // Stripe & Windows
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(bus.x, bus.y + 75, bus.w, 14);
    ctx.fillStyle = "#111";
    ctx.fillRect(bus.x + 15, bus.y + 15, 35, 45);
    ctx.fillRect(bus.x + 70, bus.y + 15, 35, 45);
    ctx.fillRect(bus.x + 15, bus.y + 105, 35, 45);
    ctx.fillRect(bus.x + 70, bus.y + 105, 35, 45);

    // Door
    ctx.fillStyle = "#ddd";
    ctx.fillRect(bus.doorX - 15, bus.doorY - 15, 30, 30);
    ctx.fillStyle = "#111";
    ctx.font = "9px Courier New";
    ctx.fillText("DOOR", bus.doorX - 12, bus.doorY + 3);

    // Draw Student NPCs with Custom Pixel Models
    npcs.forEach(npc => {
        if (npc.x < -500) return;
        drawPixelStudent(npc.x, npc.y, npc.style, 0.9, npc.stunned > 0);
    });

    // Draw Player Character Model
    drawPixelStudent(player.x, player.y, player.style, 1.0, false);

    // Punch Shockwave Visual Feedback
    if (player.isPunching) {
        ctx.strokeStyle = "#ffff00";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 35, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function renderStage2() {
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Side Windows
    ctx.fillStyle = "#223344";
    ctx.fillRect(50, 40, 90, 370);
    ctx.fillRect(660, 40, 90, 370);
    
    ctx.strokeStyle = "#444";
    ctx.lineWidth = 4;
    ctx.strokeRect(50, 40, 90, 370);
    ctx.strokeRect(660, 40, 90, 370);

    // Bus Center Aisle Floor
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(140, 0, 520, canvas.height);

    // Side Seats
    ctx.fillStyle = "#1e3a8a"; 
    for (let i = 0; i < 5; i++) {
        ctx.fillRect(55, 60 + i * 72, 75, 48);
        ctx.strokeStyle = "#ffcc00";
        ctx.strokeRect(55, 60 + i * 72, 75, 48);
        
        ctx.fillRect(670, 60 + i * 72, 75, 48);
        ctx.strokeRect(670, 60 + i * 72, 75, 48);
    }

    // Yellow Grab Poles
    ctx.strokeStyle = "#ffcc00";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(200, 0); ctx.lineTo(200, 420);
    ctx.moveTo(600, 0); ctx.lineTo(600, 420);
    ctx.stroke();

    // Driver Area
    ctx.fillStyle = "#222";
    ctx.fillRect(300, 0, 200, 75);
    ctx.strokeStyle = "#cc0033";
    ctx.lineWidth = 2;
    ctx.strokeRect(300, 0, 200, 75);
    
    ctx.fillStyle = "#ffaa00";
    ctx.beginPath();
    ctx.arc(400, 30, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "10px Courier New";
    ctx.fillText("DRIVER", 380, 62);

    // Render Passengers Inside Bus
    for (let i = 0; i < 10; i++) {
        let px = 240 + (i % 2) * 320 + Math.sin(stage2Progress * 0.1 + i) * 4;
        let py = 100 + Math.floor(i / 2) * 60;
        let style = (i % 2 === 0) ? getRandomStudentStyle() : playerStyle;
        drawPixelStudent(px, py, style, 0.85);
    }

    // Render Player Character in Aisle
    let playerX = 400 + busBalance * 2;
    drawPixelStudent(playerX, 350, playerStyle, 1.0);
    
    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 11px Courier New";
    ctx.fillText("YOU", playerX - 10, 380);

    // Balance Bar UI
    ctx.fillStyle = "#222";
    ctx.fillRect(200, 440, 400, 25);
    ctx.fillStyle = Math.abs(busBalance) > 70 ? "#ff3333" : "#00ffcc";
    ctx.fillRect(400, 440, busBalance * 2, 25);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(200, 440, 400, 25);

    ctx.fillStyle = "#fff";
    ctx.font = "14px Courier New";
    ctx.fillText(`Trip Progress: ${Math.floor(stage2Progress)}%`, 310, 22);
    ctx.fillText("HOLD ON FOR DEAR LIFE! (Use A/D to Balance)", 185, 425);
}

function renderEndScreen(isWin) {
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "32px Courier New";
    if (isWin) {
        ctx.fillStyle = "#00ffcc";
        ctx.fillText("YOU MADE IT TO CLASS!", 220, 220);
        ctx.font = "18px Courier New";
        ctx.fillStyle = "#fff";
        ctx.fillText("You survived peak hours on the RU bus system.", 190, 270);
    } else {
        ctx.fillStyle = "#ff3333";
        ctx.fillText("YOU LOST!", 330, 200);
        ctx.font = "18px Courier New";
        ctx.fillStyle = "#fff";
        ctx.fillText("You missed the bus, ran out of time, or went flying!", 130, 250);
        ctx.fillText("You are late to class and failed the semester.", 160, 280);
    }

    ctx.fillStyle = "#aaa";
    ctx.font = "15px Courier New";
    ctx.fillText("Click anywhere to return to Route Selection", 210, 350);
}

function gameLoop(time) {
    let dt = (time - lastTime) / 1000;
    if (isNaN(dt) || dt > 0.1) dt = 0.016;
    lastTime = time;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
