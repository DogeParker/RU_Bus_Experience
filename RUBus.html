<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The RU Bus Experience Game</title>
    <script src="bus-game.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(204, 0, 51, 0.5);
            border: 4px solid #cc0033;
        }
        canvas {
            background-color: #222;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        .capacity-bar-container {
            width: 130px;
            height: 14px;
            background: #333;
            border: 2px solid #fff;
            display: inline-block;
            position: relative;
            vertical-align: middle;
            margin-left: 5px;
        }
        .capacity-fill {
            height: 100%;
            background: #cc0033;
            width: 0%;
            transition: width 0.1s;
        }
        #controls-hint {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="route-info">Choose A Route</div>
            <div>
                <span id="bus-capacity-text">Bus: 0/18</span>
                <div class="capacity-bar-container"><div id="capacity-fill" class="capacity-fill"></div></div>
            </div>
            <div id="timer" style="color: #ffcc00;">Time Left: --</div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="controls-hint">
        <strong>Controls:</strong> Stage 1: [WASD] Move | [Q] Punch/Push Students | Stage 2: [A/D] Balance & Resist Crowds
    </div>
</body>
</html>
